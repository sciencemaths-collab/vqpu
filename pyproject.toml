[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "vqpu-sdk"
version = "0.5.0"
description = "Qualified local compute engine with vQPU quantum fabric."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [
    { name = "Bernard Essuman", email = "bessuman.academia@gmail.com" },
]
keywords = [
    "quantum computing", "quantum simulation", "backend abstraction",
    "circuit knitting", "variational optimization", "QAOA", "VQE",
    "quantum algorithms", "QPU", "GPU", "quantum compiler",
]
dependencies = [
    "numpy>=1.22; python_version < '3.14'",
    "numpy>=2.3; python_version >= '3.14'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/sciencemaths-collab/vqpu"
Documentation = "https://github.com/sciencemaths-collab/vqpu#readme"
Repository = "https://github.com/sciencemaths-collab/vqpu"
Issues = "https://github.com/sciencemaths-collab/vqpu/issues"

[project.optional-dependencies]
test = ["build>=1.3", "matplotlib>=3.7", "mypy>=1.18", "pip-audit>=2.9", "pytest>=8", "ruff>=0.13"]
# Hardware backends — install only what you have.
cuda   = ["cupy-cuda12x"]
cuda11 = ["cupy-cuda11x"]
rocm   = ["cupy-rocm-5-0; python_version < '3.14'"]
apple  = ["mlx"]
intel  = ["torch", "intel-extension-for-pytorch"]
tpu    = ["jax[tpu]"]

# Cloud QPU SDKs.
ibm     = ["qiskit", "qiskit-ibm-runtime"]
ionq    = ["qiskit", "qiskit-ionq"]
rigetti = ["pyquil"]
google  = ["cirq-google"]
azure   = ["azure-quantum"]
aws     = ["amazon-braket-sdk"]

# Convenience bundles.
all-classical = ["vqpu-sdk[cuda]", "vqpu-sdk[apple]", "vqpu-sdk[intel]", "vqpu-sdk[tpu]"]
all-qpu       = ["vqpu-sdk[ibm]", "vqpu-sdk[ionq]", "vqpu-sdk[rigetti]",
                 "vqpu-sdk[google]", "vqpu-sdk[azure]", "vqpu-sdk[aws]"]

[project.scripts]
vqpu = "vqpu.__main__:main"

[tool.setuptools.packages.find]
include = ["vqpu*"]
exclude = ["examples*", "_legacy*", "benchmark_results*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/clean_wheel_acceptance.py" = ["S603"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["vqpu/compute_engine.py", "vqpu/qualification.py"]
follow_imports = "skip"
